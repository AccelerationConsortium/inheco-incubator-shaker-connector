[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "unitelabs-inheco-incubator-shaker"
version = "0.3.1"
description = "SiLA 2 connector for INHECO Incubator Shaker MP using UniteLabs CDK"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sissi Feng" }]
requires-python = ">=3.10"
dependencies = ["unitelabs-cdk==0.16.0", "pyserial==3.5"]
[project.scripts]
shaker-ui = "unitelabs.inheco_incubator_shaker.ui:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "aiohttp==3.14.5"]
ui = ["aiohttp==3.14.5"]
dev = ["ruff==0.17.1", "markdown-it-py==4.2.0"]
[tool.hatch.build.targets.wheel]
packages = ["src/unitelabs"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
